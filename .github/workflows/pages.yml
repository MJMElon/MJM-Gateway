# 推送到 main 后，把 repo 根目录的 HTML 原样发布到 GitHub Pages（不需要建置）
# Pages 设定为「GitHub Actions」时由这个流程发布；设定为「从分支发布」时 GitHub 会直接发布分支内容
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
