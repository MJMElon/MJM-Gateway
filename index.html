<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MJM Connect</title>
<script src="shared/head.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="shared/home.js"></script>
</head>
<body class="gw-wallpaper">
<main id="main"></main>
<script>
/* 主画面（像 iPhone）：App、小工具、文件夹，拖拉排版；右下角浮动按钮新增小工具 / App */
(async function () {
  const { t, esc } = GW;
  const profile = await GW.requireProfile("user");
  if (!profile) return;
  const main = GW.shell(profile, "home");
  main.innerHTML = GW.spinner();
  const firstVisit = !profile.layout_initialized;
  // 主页按 Business 分区块（资料表还没建立时退回旧的棋盘版面）
  const secRes = await GW.sb.from("gw_user_sections").select("group_id, expanded");
  const sectionsOn = !secRes.error;
  // 旧版：第一次登录按群组自动排好预设版面
  if (firstVisit && !sectionsOn) await GW.sb.rpc("gw_init_layout");
  const [{ data, error }, widgetRes, memberRes, linkRes, imgRes, itemRes, groupRes, gmodRes, bcoRes, coRes, mcoRes, myCoRes] = await Promise.all([
    GW.sb.rpc("gw_get_home"),
    GW.sb.from("gw_user_widgets").select("*").order("sort_order"),
    GW.sb.from("gw_group_members").select("group_id").eq("user_id", profile.id),
    GW.sb.from("gw_user_links").select("*").order("sort_order"),
    GW.sb.from("gw_modules").select("id, image_url"),
    sectionsOn ? GW.sb.from("gw_user_section_items").select("*").order("sort_order") : Promise.resolve({ data: [] }),
    sectionsOn ? GW.sb.from("gw_groups").select("id, name, sort_order").order("sort_order").order("name") : Promise.resolve({ data: [] }),
    sectionsOn ? GW.sb.from("gw_group_modules").select("group_id, module_id") : Promise.resolve({ data: [] }),
    // 区块里的 Company 选择：这个 Business 有哪些 Company、哪些模块标了哪些 Company
    sectionsOn ? GW.sb.from("gw_business_companies").select("group_id, company_id") : Promise.resolve({ data: [] }),
    sectionsOn ? GW.sb.from("gw_companies").select("id, name, code, short_name").eq("is_active", true).order("sort_order").order("name") : Promise.resolve({ data: [] }),
    sectionsOn ? GW.sb.from("gw_module_companies").select("module_id, company_id") : Promise.resolve({ data: [] }),
    sectionsOn ? GW.sb.from("gw_member_companies").select("group_id, company_id").eq("user_id", profile.id) : Promise.resolve({ data: [] }),
  ]);
  if (error) return (main.innerHTML = GW.alertBox(t("errors.description")));
  // 模块照片
  const imgs = new Map(((imgRes && imgRes.data) || []).map((m) => [m.id, m.image_url]));
  data.modules.forEach((m) => (m.image_url = imgs.get(m.id) || null));
  const links = (linkRes && linkRes.data) || [];

  // 小工具资料表还没建立（资料库尚未更新）时，主画面照常运作，只是不能加小工具
  let widgets = widgetRes.error ? null : widgetRes.data;
  // Notice Board（公告栏）：每个人都一定有一个，固定在最上面
  const notice = { widget_type: "announcements", size: "medium", sort_order: -1, user_id: profile.id, config: {} };
  // 旧版预设的 Greeting / Search 换成 Notice Board（每人一次）
  const noticeKey = "gw_widgets_notice_" + profile.id;
  let cleaned = false;
  try {
    cleaned = !!localStorage.getItem(noticeKey);
  } catch (e) {
    /* 忽略 */
  }
  if (widgets) {
    const boards = widgets.filter((w) => w.widget_type === "announcements");
    const drop = [...(cleaned ? [] : widgets.filter((w) => w.widget_type === "greeting" || w.widget_type === "search")), ...boards.slice(1)].map((w) => w.id);
    if (drop.length) await GW.sb.from("gw_user_widgets").delete().in("id", drop);
    widgets = widgets.filter((w) => !drop.includes(w.id));
    if (!boards.length) {
      const res = await GW.sb.from("gw_user_widgets").insert(notice).select();
      if (!res.error) widgets = [...res.data, ...widgets];
    }
    try {
      localStorage.setItem(noticeKey, "1");
    } catch (e) {
      /* 忽略 */
    }
  }

  // 还没被放进任何 Business、也没有管理权：显示「等待分配」
  const memberOf = memberRes.error ? [] : (memberRes.data || []).map((m) => m.group_id);
  const pending = !profile.manages && !memberRes.error && memberOf.length === 0 && data.modules.length === 0;
  // 新开给他的 App（还没看过、也不在主画面上）：自动放到主画面最后面
  const placed = new Set(data.layout.map((l) => l.module_id));
  const fresh = data.modules.filter((m) => m.is_new && !placed.has(m.id));
  if (!pending && !sectionsOn && fresh.length) {
    const start = Math.max(0, ...data.layout.map((l) => l.sort_order));
    const items = fresh.map((m, i) => ({ module_id: m.id, folder_id: null, sort_order: start + i + 1, card_size: "large" }));
    const { error: fillError } = await GW.sb.rpc("gw_save_layout", { p_items: items });
    if (!fillError) {
      data.layout = [...data.layout, ...items];
      GW.sb.rpc("gw_mark_seen", { p_modules: fresh.map((m) => m.id) });
    }
  }
  main.innerHTML = '<div id="board" class="mx-auto max-w-5xl"></div>';
  const memberSet = new Set(memberOf);
  const sections = sectionsOn
    ? {
        groups: (groupRes.data || []).filter((g) => memberSet.has(g.id)),
        groupModules: gmodRes.data || [],
        bizCompanies: bcoRes.data || [],
        companies: coRes.data || [],
        moduleCompanies: mcoRes.data || [],
        // 在这个 Business 里只属于一个 Company 的人，预设选那个 Company；属于好几个就预设「全部」
        myCompany: Object.fromEntries(
          (myCoRes.data || [])
            .filter((m, _i, all) => all.filter((y) => y.group_id === m.group_id).length === 1)
            .map((m) => [m.group_id, m.company_id]),
        ),
        items: itemRes.data || [],
        state: secRes.data || [],
      }
    : null;
  GWHome.render(document.getElementById("board"), data, { widgets, profile, pending, memberOf, links, sections });
})();
</script>
</body>
</html>
