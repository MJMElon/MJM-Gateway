<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MJM Connect</title>
<script src="shared/head.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="shared/home.js"></script>
</head>
<body class="gw-wallpaper">
<main id="main"></main>
<script>
/* 主画面（像 iPhone）：App、小工具、文件夹，拖拉排版；右下角浮动按钮新增小工具 / App */
(async function () {
  const { t, esc } = GW;
  const profile = await GW.requireProfile("user");
  if (!profile) return;
  const main = GW.shell(profile, "home");
  main.innerHTML = GW.spinner();
  const firstVisit = !profile.layout_initialized;
  // 第一次登录：按群组自动排好预设版面
  if (firstVisit) await GW.sb.rpc("gw_init_layout");
  const [{ data, error }, widgetRes, memberRes] = await Promise.all([
    GW.sb.rpc("gw_get_home"),
    GW.sb.from("gw_user_widgets").select("*").order("sort_order"),
    GW.sb.from("gw_group_members").select("group_id").eq("user_id", profile.id),
  ]);
  if (error) return (main.innerHTML = GW.alertBox(t("errors.description")));

  // 小工具资料表还没建立（资料库尚未更新）时，主画面照常运作，只是不能加小工具
  let widgets = widgetRes.error ? null : widgetRes.data;
  // 预设小工具：Notice Board（公告栏），放在最上面，每位用户加一次
  const notice = { widget_type: "announcements", size: "large", sort_order: -1, user_id: profile.id, config: {} };
  const seededKey = "gw_widgets_seeded_" + profile.id;
  // 旧版预设的 Greeting / Search 换成 Notice Board（每人一次）
  const noticeKey = "gw_widgets_notice_" + profile.id;
  const flag = (k) => {
    try {
      return !!localStorage.getItem(k);
    } catch (e) {
      return false;
    }
  };
  if (widgets && widgets.length === 0 && (firstVisit || !flag(seededKey))) {
    const res = await GW.sb.from("gw_user_widgets").insert(notice).select();
    if (!res.error) widgets = res.data;
  } else if (widgets && !flag(noticeKey)) {
    const old = widgets.filter((w) => w.widget_type === "greeting" || w.widget_type === "search").map((w) => w.id);
    if (old.length) await GW.sb.from("gw_user_widgets").delete().in("id", old);
    widgets = widgets.filter((w) => !old.includes(w.id));
    if (!widgets.some((w) => w.widget_type === "announcements")) {
      const res = await GW.sb.from("gw_user_widgets").insert(notice).select();
      if (!res.error) widgets = [...res.data, ...widgets];
    }
  }
  try {
    localStorage.setItem(seededKey, "1");
    if (widgets) localStorage.setItem(noticeKey, "1");
  } catch (e) {
    /* 忽略 */
  }

  // 公告要显示发布日期（gw_get_home 没有日期），直接读公告表；RLS 只给看得到的，再按生效时间筛
  const annRes = await GW.sb.from("gw_announcements").select("id, message, level, starts_at, ends_at, is_active, department_id").order("starts_at", { ascending: false });
  if (!annRes.error) {
    const now = Date.now();
    data.announcements = annRes.data.filter(
      (a) =>
        a.is_active &&
        new Date(a.starts_at).getTime() <= now &&
        (!a.ends_at || new Date(a.ends_at).getTime() > now) &&
        (!a.department_id || a.department_id === profile.department_id),
    );
  }

  // 一般用户还没被分配到群组、也没有个人开放的 App：显示「等待分配」
  const isAdmin = profile.role === "super_admin" || profile.role === "admin";
  const pending = !isAdmin && !memberRes.error && (memberRes.data || []).length === 0 && data.modules.length === 0;
  // 从「等待开通」变成有权限：主画面还是空的，就把有权限的 App 都放上去（每人一次）
  const filledKey = "gw_home_filled_" + profile.id;
  let filled = false;
  try {
    filled = !!localStorage.getItem(filledKey);
  } catch (e) {
    /* 忽略 */
  }
  if (!pending && !filled && data.layout.length === 0 && data.modules.length > 0) {
    const items = data.modules.map((m, i) => ({ module_id: m.id, folder_id: null, sort_order: i + 1, card_size: "large" }));
    const { error: fillError } = await GW.sb.rpc("gw_save_layout", { p_items: items });
    if (!fillError) {
      data.layout = items;
      GW.sb.rpc("gw_mark_seen", { p_modules: data.modules.map((m) => m.id) });
    }
  }
  if (data.layout.length > 0) {
    try {
      localStorage.setItem(filledKey, "1");
    } catch (e) {
      /* 忽略 */
    }
  }
  main.innerHTML = '<div id="board" class="mx-auto max-w-5xl"></div>';
  GWHome.render(document.getElementById("board"), data, { widgets, profile, pending });
})();
</script>
</body>
</html>
