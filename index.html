<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MJM Connect</title>
<script src="shared/head.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="shared/home.js"></script>
</head>
<body class="gw-wallpaper">
<main id="main"></main>
<script>
/* 主画面（像 iPhone）：App、小工具、文件夹，拖拉排版；右下角浮动按钮新增小工具 / App */
(async function () {
  const { t, esc } = GW;
  const profile = await GW.requireProfile("user");
  if (!profile) return;
  const main = GW.shell(profile, "home");
  main.innerHTML = GW.spinner();
  const firstVisit = !profile.layout_initialized;
  // 第一次登录：按群组自动排好预设版面
  if (firstVisit) await GW.sb.rpc("gw_init_layout");
  const [{ data, error }, widgetRes] = await Promise.all([
    GW.sb.rpc("gw_get_home"),
    GW.sb.from("gw_user_widgets").select("*").order("sort_order"),
  ]);
  if (error) return (main.innerHTML = GW.alertBox(t("errors.description")));

  // 小工具资料表还没建立（资料库尚未更新）时，主画面照常运作，只是不能加小工具
  let widgets = widgetRes.error ? null : widgetRes.data;
  // 预设小工具：每位用户第一次看到主画面时加一次
  const seededKey = "gw_widgets_seeded_" + profile.id;
  let seeded = false;
  try {
    seeded = !!localStorage.getItem(seededKey);
  } catch (e) {
    /* 忽略 */
  }
  if (widgets && widgets.length === 0 && (firstVisit || !seeded)) {
    const isAdmin = profile.role === "super_admin" || profile.role === "admin";
    const rows = [
      { widget_type: "greeting", size: "medium", sort_order: -3 },
      ...(isAdmin ? [{ widget_type: "admin", size: "medium", sort_order: -2 }] : []),
      { widget_type: "search", size: "medium", sort_order: -1 },
    ].map((r) => ({ ...r, user_id: profile.id, config: {} }));
    const res = await GW.sb.from("gw_user_widgets").insert(rows).select();
    if (!res.error) widgets = res.data;
  }
  try {
    localStorage.setItem(seededKey, "1");
  } catch (e) {
    /* 忽略 */
  }

  main.innerHTML = '<div id="board" class="mx-auto max-w-5xl"></div>';
  GWHome.render(document.getElementById("board"), data, { widgets, profile });
})();
</script>
</body>
</html>
