<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MJM Connect</title>
<script src="shared/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  /* 登录封面：白底，MJM 三个字有深绿粗框，字里填满绿、黄、白大小不一的圆（像大连那面贝壳字墙）。
     进页面时字母依序从上方落下，接着出现白色玻璃方框（Email / Password / Sign in）。 */
  :root { --frame: #1f5a3c; --frame-deep: #123826; }
  html, body { background: #ffffff !important; color: #0f172a; }
  body { overflow-x: hidden; }

  .stage { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6vh 16px; }
  .word { display: flex; align-items: flex-end; justify-content: center; gap: clamp(6px, 1.4vw, 18px); width: min(94vw, 980px); }
  .letter { flex: 1 1 0; min-width: 0; opacity: 0; transform: translateY(-110vh); }
  .letter svg { display: block; width: 100%; height: auto; overflow: visible; }
  /* 落下：稍微弹一下再停住 */
  @keyframes drop {
    0% { opacity: 1; transform: translateY(-110vh); }
    70% { opacity: 1; transform: translateY(14px); }
    85% { transform: translateY(-6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .ready .letter { animation: drop .9s cubic-bezier(.3, .7, .3, 1) forwards; }
  .ready .letter:nth-child(2) { animation-delay: .18s; }
  .ready .letter:nth-child(3) { animation-delay: .36s; }

  /* 白色玻璃方框：压在字的下缘，后面的圆点会透出模糊 */
  .glass {
    position: relative; z-index: 2; width: min(92vw, 360px); margin-top: clamp(-56px, -3.6vw, -14px);
    padding: 26px 24px 20px; border-radius: 22px;
    background: rgba(255, 255, 255, .62);
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 20px 50px rgba(18, 56, 38, .14), 0 2px 8px rgba(18, 56, 38, .06);
    opacity: 0; transform: translateY(24px) scale(.97);
    transition: opacity .6s, transform .7s cubic-bezier(.2, .8, .2, 1);
  }
  .show-glass .glass { opacity: 1; transform: none; }
  .brand { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .5em; text-indent: .5em; color: var(--frame); margin-bottom: 18px; }
  .glass label > span { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .glass input {
    width: 100%; height: 44px; border-radius: 12px; border: 1px solid rgba(15, 23, 42, .14); background: rgba(255, 255, 255, .85);
    padding: 0 14px; font-size: 15px; color: #0f172a; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .glass input:focus { border-color: var(--frame); box-shadow: 0 0 0 3px rgba(31, 90, 60, .15); }
  .glass .go {
    width: 100%; height: 46px; border: 0; border-radius: 12px; cursor: pointer; color: #fff; font-weight: 600; font-size: 15px;
    background: var(--frame); transition: background .2s;
  }
  .glass .go:hover { background: var(--frame-deep); }
  .glass .go:disabled { opacity: .7; cursor: default; }
  .glass .link { font-size: 13px; color: var(--frame); background: none; border: 0; cursor: pointer; }
  .glass .link:hover { text-decoration: underline; text-underline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .letter { opacity: 1; transform: none; }
    .ready .letter { animation: none; }
    .glass { transition: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="word" id="word" role="img" aria-label="MJM"></div>
  <div class="glass" id="glass">
    <div class="brand">CONNECT</div>
    <div id="card"></div>
  </div>
</main>

<script>
/* ---------------------------------------------------------------- 字标
   每个字母一个 SVG：深绿厚度 → 米白底 → 圆点（用字形裁切）→ 深绿粗框。
   圆点用固定种子产生，每次看到的都一样。 */
(function () {
  const COLORS = [
    ["#2f7d4f", 3], ["#4f9d69", 3], ["#8cc084", 2], // 绿
    ["#f2c230", 3], ["#f7d774", 2], ["#e8a92e", 1], // 黄
    ["#ffffff", 4], ["#f4efe2", 2], // 白
  ];
  const BAG = COLORS.flatMap(([c, w]) => Array(w).fill(c));
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  };
  function random(seed) {
    return () => {
      seed |= 0;
      seed = (seed + 0x6d2b79f5) | 0;
      let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  const textAttrs = { x: 0, y: 0, "font-family": "'Archivo Black', 'Arial Black', sans-serif", "font-size": 320 };

  function buildLetter(ch, index) {
    const wrap = document.createElement("div");
    wrap.className = "letter";
    const svg = el("svg", { "aria-hidden": "true" });
    wrap.appendChild(svg);
    document.getElementById("word").appendChild(wrap);

    // 量字形实际墨迹范围（getBBox 会包含整个行高，下面会多出空白）
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${textAttrs["font-size"]}px ${textAttrs["font-family"]}`;
    const m = ctx.measureText(ch);
    const b = {
      x: -m.actualBoundingBoxLeft,
      y: -m.actualBoundingBoxAscent,
      width: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
      height: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent,
    };
    const pad = 8;
    const depth = 9;
    const vbWidth = b.width + pad * 2 + depth;
    svg.setAttribute("viewBox", `${b.x - pad} ${b.y - pad} ${vbWidth} ${b.height + pad * 2 + depth}`);
    // 宽度按字形比例分配，三个字母一样高
    wrap.style.flex = `${vbWidth} 1 0`;

    const clipId = "clip-" + index;
    const defs = el("defs");
    const clip = el("clipPath", { id: clipId });
    const clipText = el("text", textAttrs);
    clipText.textContent = ch;
    clip.appendChild(clipText);
    defs.appendChild(clip);
    svg.appendChild(defs);

    // 厚度（往右下）
    const back = el("text", { ...textAttrs, fill: "#123826", stroke: "#123826", "stroke-width": 16, "stroke-linejoin": "round", transform: `translate(${depth} ${depth})` });
    back.textContent = ch;
    svg.appendChild(back);
    // 米白底，圆点之间的缝看起来像墙里的填料
    const base = el("text", { ...textAttrs, fill: "#faf7ef" });
    base.textContent = ch;
    svg.appendChild(base);

    // 圆点：由大到小随机放，不重叠
    const rnd = random(20261029 + index * 97);
    const dots = el("g", { "clip-path": `url(#${clipId})` });
    const placed = [];
    const RADII = [18, 15, 12, 10, 8, 6.5, 5, 4, 3];
    RADII.forEach((r, level) => {
      const tries = 260 + level * 180;
      for (let i = 0; i < tries; i++) {
        const cx = b.x + rnd() * b.width;
        const cy = b.y + rnd() * b.height;
        const rr = r * (0.85 + rnd() * 0.3);
        if (placed.some((p) => Math.hypot(p[0] - cx, p[1] - cy) < p[2] + rr + 1.4)) continue;
        placed.push([cx, cy, rr]);
        const color = BAG[Math.floor(rnd() * BAG.length)];
        dots.appendChild(el("circle", { cx: cx.toFixed(1), cy: cy.toFixed(1), r: rr.toFixed(1), fill: color, stroke: "rgba(18,56,38,.18)", "stroke-width": 0.8 }));
        // 大一点的圆加一点反光，像贝壳石子
        if (rr > 7) dots.appendChild(el("circle", { cx: (cx - rr * 0.35).toFixed(1), cy: (cy - rr * 0.35).toFixed(1), r: (rr * 0.28).toFixed(1), fill: "#fff", opacity: 0.45 }));
      }
    });
    svg.appendChild(dots);

    // 深绿粗框
    const frame = el("text", { ...textAttrs, fill: "none", stroke: "#1f5a3c", "stroke-width": 10, "stroke-linejoin": "round" });
    frame.textContent = ch;
    svg.appendChild(frame);
  }

  const start = () => {
    ["M", "J", "M"].forEach(buildLetter);
    const stage = document.getElementById("stage");
    requestAnimationFrame(() => stage.classList.add("ready"));
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    // 三个字母落定后出现玻璃方框
    setTimeout(() => stage.classList.add("show-glass"), reduce ? 0 : 1300);
  };
  // 等字体载入后再量字形；字体载入失败也照常显示
  Promise.race([document.fonts.load("320px 'Archivo Black'"), new Promise((r) => setTimeout(r, 1500))]).then(start, start);
})();
</script>

<script>
/* ---------------------------------------------------------------- 登录 / 忘记密码 / 改密码 */
const { sb, t, esc, $, invoke, go } = GW;
document.documentElement.classList.remove("dark"); // 封面固定白底
const params = new URLSearchParams(location.search);
const card = $("#card");

const field = (label, input) => `<label class="block"><span>${esc(label)}</span>${input}</label>`;
const message = (text, ok) =>
  text ? `<div class="rounded-lg border px-3 py-2 text-sm ${ok ? "border-emerald-200 bg-emerald-50 text-emerald-800" : "border-red-200 bg-red-50 text-red-700"}">${esc(text)}</div>` : "";

function showLogin(errorText) {
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div id="msg">${message(errorText)}</div>
      ${field(t("login.email"), `<input name="email" type="email" autocomplete="username" required inputmode="email">`)}
      ${field(t("login.password"), `<input name="password" type="password" autocomplete="current-password" required>`)}
      <button type="submit" class="go">${esc(t("login.submit"))}</button>
      <div class="text-center"><button type="button" class="link" id="forgot">${esc(t("login.forgot"))}</button></div>
    </form>`;
  $("#forgot").onclick = showForgot;
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const email = String(form.get("email") || "").trim().toLowerCase();
    const submit = e.target.querySelector(".go");
    submit.disabled = true;
    submit.textContent = t("login.submitting");
    const r = await invoke("gw-auth", { action: "login", email, password: String(form.get("password") || "") });
    if (r && r.session) {
      const { error } = await sb.auth.setSession(r.session);
      if (!error) return go(r.must_change_password ? "login.html?mode=change" : "index.html");
    }
    const err = (r && r.error) || "unknown";
    const msg =
      err === "invalid" && r.remaining != null ? t("login.errors.invalidRemaining", { remaining: r.remaining })
      : err === "invalid" ? t("login.errors.invalid")
      : err === "locked" ? t("login.errors.locked", { minutes: r.minutes || 15 })
      : err === "disabled" ? t("login.errors.disabled")
      : err === "no_access" ? t("login.errors.noAccess")
      : t("login.errors.unknown");
    $("#msg").innerHTML = message(msg);
    submit.disabled = false;
    submit.textContent = t("login.submit");
  });
}

function showForgot() {
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div>
        <h2 class="text-base font-semibold" style="color:var(--frame)">${esc(t("forgot.title"))}</h2>
        <p class="mt-1 text-sm text-slate-500">${esc(t("forgot.description"))}</p>
      </div>
      <div id="msg"></div>
      ${field(t("forgot.email"), `<input name="email" type="email" required inputmode="email">`)}
      <button type="submit" class="go">${esc(t("forgot.submit"))}</button>
      <div class="text-center"><button type="button" class="link" id="back">${esc(t("forgot.back"))}</button></div>
    </form>`;
  $("#back").onclick = () => showLogin();
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = String(new FormData(e.target).get("email") || "").trim().toLowerCase();
    e.target.querySelector(".go").disabled = true;
    const redirectTo = new URL("login.html?mode=reset", location.href).href;
    if (email) await sb.auth.resetPasswordForEmail(email, { redirectTo });
    // 不论 email 是否存在都显示相同结果，避免泄漏帐号
    $("#msg").innerHTML = message(t("forgot.sent"), true);
  });
}

async function showChange(reset) {
  const { session, profile } = await GW.loadProfile();
  if (!session) return showLogin(reset ? t("login.errors.linkExpired") : "");
  if (!profile || profile.status !== "active") {
    await sb.auth.signOut();
    return showLogin(t("login.errors.noAccess"));
  }
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div>
        <h2 class="text-base font-semibold" style="color:var(--frame)">${esc(t(reset ? "password.resetTitle" : "password.forcedTitle"))}</h2>
        <p class="mt-1 text-sm text-slate-500">${esc(t(reset ? "password.resetDescription" : "password.forcedDescription"))}</p>
      </div>
      <div id="msg"></div>
      ${field(t("password.new"), `<input name="password" type="password" autocomplete="new-password" required minlength="8">`)}
      <p class="-mt-2 text-xs text-slate-500">${esc(t("password.rule"))}</p>
      ${field(t("password.confirm"), `<input name="confirm" type="password" autocomplete="new-password" required minlength="8">`)}
      <button type="submit" class="go">${esc(t("password.submit"))}</button>
    </form>`;
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const error = await GW.changePassword(String(form.get("password") || ""), String(form.get("confirm") || ""));
    if (error) return ($("#msg").innerHTML = message(t("password.errors." + error)));
    go("index.html");
  });
}

(async function main() {
  const mode = params.get("mode");
  const error = params.get("error");
  if (mode === "change" || mode === "reset") {
    // 从重设密码邮件回来：等 Supabase 用网址里的 code 换好 session
    if (mode === "reset") await new Promise((r) => setTimeout(r, 300));
    return showChange(mode === "reset");
  }
  if (mode === "forgot") return showForgot();
  // 已登录就直接进首页
  const { session, profile } = await GW.loadProfile();
  if (session && profile && profile.status === "active" && !error) {
    return go(profile.must_change_password ? "login.html?mode=change" : "index.html");
  }
  showLogin(error === "no_access" ? t("login.errors.noAccess") : error === "link_expired" ? t("login.errors.linkExpired") : "");
})();
</script>
</body>
</html>
